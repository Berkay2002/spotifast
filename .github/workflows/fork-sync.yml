name: Fork sync

# Berkay2002/spotifast republishes every crmne/spotifast stable release with
# the branches in .github/fork-branches.txt merged in, signed with the fork's
# own update key, so the installed app's built-in updater follows it.
# Windows x64 only. The packaging steps are copied from release.yml's build
# and publish jobs; keep them in step when that workflow changes.
#
# Runs from the default branch (`mine`), which each sync force-updates, so the
# lists below are read from fork/update-channel, their one source of truth.
#
# Pushing a merge that touches .github/workflows/ needs a token with the
# `workflow` scope, which GITHUB_TOKEN never has: add a PAT as FORK_SYNC_TOKEN
# when a sync fails there.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "crmne release tag to build (default: its latest stable release)"
        required: false
        type: string
      force:
        description: "Rebuild and replace the fork's release if it already exists"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

env:
  UPSTREAM: crmne/spotifast
  TARGET: x86_64-pc-windows-msvc

jobs:
  merge:
    name: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      build: ${{ steps.sync.outputs.build }}
      tag: ${{ steps.sync.outputs.tag }}
      sha: ${{ steps.sync.outputs.sha }}
      latest: ${{ steps.sync.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: fork/update-channel
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      - name: Merge the fork's branches onto the release tag
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          set -euo pipefail

          # A conflict or a moved pin is for a human: file one issue per
          # problem (the same open issue is reused), then fail the run.
          fail() { # title, body
            echo "::error title=$1::$2"
            existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$1\" in:title" --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -z "$existing" ]; then
              gh issue create -R "$GITHUB_REPOSITORY" --title "$1" --body "$2

          Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                || echo "::warning::Could not open an issue (issues disabled for the fork?)"
            fi
            exit 1
          }

          tag="$INPUT_TAG"
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          [ -n "$tag" ] || tag="$latest"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Not a stable release tag: $tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          [ "$tag" = "$latest" ] && echo "latest=true" >> "$GITHUB_OUTPUT" || echo "latest=false" >> "$GITHUB_OUTPUT"

          if [ "$INPUT_FORCE" != "true" ] && gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The fork already has a release for $tag."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The lists, before the checkout moves off fork/update-channel.
          branches=$(tr -d '\r' < .github/fork-branches.txt | sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v '^$')
          pin=$(tr -d '\r\n ' < .github/fork-librespot-pin.txt)

          git config user.name "fork-sync"
          git config user.email "fork-sync@users.noreply.github.com"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "refs/tags/$tag:refs/upstream-tags/$tag"
          git switch --detach "refs/upstream-tags/$tag"

          # crmne pins every librespot crate to one revision. The fork's
          # librespot branch (Berkay2002/librespot, which perf/prefetch points
          # the dependencies at) was cut from the revision in the pin file.
          # This looks at crmne's tag only, before any merge: the fork's own
          # pin is expected. When crmne moves its pin, that branch needs
          # rebasing by hand.
          revs=$(grep 'github.com/crmne/librespot' Cargo.toml | grep -o 'rev = "[0-9a-f]*"' | sort -u | sed 's/rev = "\(.*\)"/\1/')
          if [ "$revs" != "$pin" ]; then
            fail "fork-sync: librespot pin moved" "$tag pins crmne/librespot at:

          $revs

          but the fork's librespot branch was cut from $pin (.github/fork-librespot-pin.txt on fork/update-channel). Rebase that branch onto crmne's new pin, repoint the fork's branches at it, then update the pin file."
          fi

          for branch in $branches; do
            git rev-parse --verify --quiet "origin/$branch" >/dev/null \
              || fail "fork-sync: missing branch $branch" "$branch is listed in .github/fork-branches.txt but does not exist in the fork. Building $tag stopped."
            if ! git merge --no-ff --no-edit -m "Merge $branch into $tag" "origin/$branch"; then
              files=$(git diff --name-only --diff-filter=U | sed 's/^/- /')
              git merge --abort || true
              fail "fork-sync conflict: $tag $branch" "Merging $branch onto $tag conflicts in:

          $files

          No release was built. Rebase $branch onto $tag and push it; the next scheduled run (or a manual dispatch) retries."
            fi
          done

          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          [ "v$version" = "$tag" ] || { echo "::error::Cargo.toml says $version but the tag is $tag"; exit 1; }

          git push --force origin HEAD:refs/heads/mine
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: build (windows x64)
    needs: merge
    if: needs.merge.outputs.build == 'true'
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: Ninja
      TAG: ${{ needs.merge.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.merge.outputs.sha }}
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}
      # The repository pins its toolchain; add the target's standard library
      # to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ env.TARGET }}
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        run: vcpkg install glew:x64-windows-static
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - run: cargo build --release --target ${{ env.TARGET }}

      - name: Verify standalone Windows runtime
        shell: pwsh
        run: |
          $binary = "target\$env:TARGET\release\spotifast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast imports an MSVC runtime:`n$runtime" }
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '8664 machine \(x64\)') { throw "$binary is not built for $env:TARGET" }
          $version = (& $binary --version | Out-String).Trim()
          if (-not $version.StartsWith("spotifast $($env:TAG.TrimStart('v'))")) { throw "Unexpected --version output: $version" }

      - name: Package
        shell: bash
        run: |
          name="spotifast-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/spotifast.exe" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp packaging/spotifast-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"

      - name: Installer
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DVersion=$version" "/DArch=x86_64" `
            "/DBinary=$PWD\target\$env:TARGET\release\spotifast.exe" `
            "/DOutputDir=$PWD\dist" packaging\windows\spotifast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '4.0'
      - name: Windows Installer package
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          gem install native-packages --version 0.9.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = $env:TAG.TrimStart("v")
          $payload = "dist\msi-input-$env:TARGET"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\$env:TARGET\release\spotifast.exe", "README.md", "LICENSE", "packaging\windows\spotifast-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target windows-amd64 --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\windows-amd64\msi\*.msi" dist\

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ env.TARGET }}
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.msi
          if-no-files-found: error

  publish:
    name: sign and publish
    needs: [merge, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.merge.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.merge.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: dist
          merge-multiple: true
      # The names the updater asks for (fastframe-update release.rs): a file
      # missing here would silently stay out of checksums.txt.
      - name: Expected downloads
        run: |
          for suffix in .zip -setup.exe .msi; do
            test -f "dist/spotifast-${TAG}-${TARGET}${suffix}" || { echo "::error::Missing spotifast-${TAG}-${TARGET}${suffix}"; exit 1; }
          done
          python3 packaging/release-names.py dist "$TAG"
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1
        with:
          ruby-version: '4.0'
      # Sign the manifest release-names.py wrote (checksums.txt.sig), then
      # check the signature and every listed file against the committed key.
      - name: Sign checksums
        env:
          SPOTIFAST_UPDATE_SIGNING_KEY: ${{ secrets.SPOTIFAST_UPDATE_SIGNING_KEY }}
        run: |
          gem install native-packages --version 0.9.0 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex \
            --key-env SPOTIFAST_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.merge.outputs.latest }}
          SHA: ${{ needs.merge.outputs.sha }}
        run: |
          {
            echo "Spotifast $TAG from [$UPSTREAM](https://github.com/$UPSTREAM/releases/tag/$TAG) with the fork's branches merged in:"
            echo
            echo "Windows x64 only. Built from \`$SHA\`."
            echo
            if [ -f "packaging/release-notes/$TAG.md" ]; then cat "packaging/release-notes/$TAG.md"; fi
          } > notes.md
          # A forced rebuild replaces the release, and the tag with it.
          gh release delete "$TAG" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create "$TAG" dist/* --target "$SHA" --title "Spotifast $TAG" \
            --notes-file notes.md --latest="$LATEST"
